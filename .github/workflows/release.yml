name: release
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"
      - name: Build (cele 5 module incluse)
        run: |
          ./build.sh
          cp Install-nTs-Suite.bat dist/
          (cd dist && zip -q nts-suite-windows-x64.zip nts-suite-windows-amd64.exe Install-nTs-Suite.bat)
      - uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: dist/*
      - uses: actions/upload-artifact@v4
        with:
          name: nts-suite
          path: dist/*
